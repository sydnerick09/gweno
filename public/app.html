<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gweno, Members area</title>
  <script>try{document.documentElement.dataset.theme=localStorage.getItem('theme')||'light'}catch(e){}</script>
  <link rel="icon" href="/img/logo.png" type="image/png" />
  <link rel="icon" href="/img/logo.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/css/styles.css?v=8" />
  <link rel="stylesheet" href="/css/app.css?v=8" />
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-4355414519050737" crossorigin="anonymous"></script>
</head>
<body>
  <div id="app">
    <div class="shell">
      <aside class="sidebar">
        <a class="brand"><img class="brand-logo" src="/img/logo.png" alt="Gweno" onerror="this.onerror=null;this.src='/img/logo.svg'"></a>
        <nav class="side-nav">
          <div class="sk sk-navitem"></div><div class="sk sk-navitem"></div><div class="sk sk-navitem"></div>
          <div class="sk sk-navitem"></div><div class="sk sk-navitem"></div><div class="sk sk-navitem"></div>
          <div class="sk sk-navitem"></div><div class="sk sk-navitem"></div>
        </nav>
      </aside>
      <div class="content">
        <header class="topbar">
          <div style="display:flex;align-items:center;gap:12px">
            <button class="hamburger">☰</button>
            <div class="sk sk-line" style="width:120px;height:18px;margin:0"></div>
          </div>
          <div class="top-right"><div class="sk sk-chip"></div><div class="sk sk-chip"></div><div class="sk sk-avatar"></div></div>
        </header>
        <main class="view">
          <div class="sk sk-line" style="width:38%;height:16px;margin-bottom:18px"></div>
          <div class="grid g4"><div class="sk sk-stat"></div><div class="sk sk-stat"></div><div class="sk sk-stat"></div><div class="sk sk-stat"></div></div>
          <div class="panel"><div class="sk sk-line" style="width:30%"></div><div class="tiles" style="margin-top:14px"><div class="sk sk-tile"></div><div class="sk sk-tile"></div><div class="sk sk-tile"></div></div></div>
          <div class="panel"><div class="sk sk-line" style="width:26%"></div><div class="sk sk-row"></div><div class="sk sk-row"></div><div class="sk sk-row"></div></div>
        </main>
      </div>
    </div>
  </div>
  <script src="/js/auth.js"></script>
  <script src="/js/countries.js?v=7"></script>
  <script src="/js/data.js"></script>
  <script src="/js/app.js?v=8"></script>
</body>
</html>
