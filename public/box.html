<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gweno</title>
  <link rel="stylesheet" href="/css/styles.css" />
  <link rel="stylesheet" href="/css/box.css?v=2" />
  <script defer src="/js/consent.js?v=1" data-ad-client="ca-pub-4355414519050737"></script>
</head>
<body class="box-page">
  <nav class="nav">
    <a class="brand" href="/"><span class="dot"></span> gweno</a>
    <div class="nav-links">
      <a class="btn btn-ghost auto" href="/">Home</a>
      <a class="btn btn-primary auto" href="/signup.html">Get started</a>
    </div>
  </nav>

  <main class="stage">
    <div class="scene">
      <div class="cube">
        <div class="face front"><img class="cube-logo" src="/img/logo.png" alt="Gweno" onerror="this.onerror=null;this.src='/img/logo.svg'"></div>
        <div class="face back"><img class="cube-logo" src="/img/logo.png" alt="Gweno" onerror="this.onerror=null;this.src='/img/logo.svg'"></div>
        <div class="face right"><img class="cube-logo" src="/img/logo.png" alt="Gweno" onerror="this.onerror=null;this.src='/img/logo.svg'"></div>
        <div class="face left"><img class="cube-logo" src="/img/logo.png" alt="Gweno" onerror="this.onerror=null;this.src='/img/logo.svg'"></div>
        <div class="face top"><img class="cube-logo" src="/img/logo.png" alt="Gweno" onerror="this.onerror=null;this.src='/img/logo.svg'"></div>
        <div class="face bottom"><img class="cube-logo" src="/img/logo.png" alt="Gweno" onerror="this.onerror=null;this.src='/img/logo.svg'"></div>
      </div>
    </div>

    <div class="stage-copy">
      <h1>gweno</h1>
      <p>Work. Earn. Grow., complete tasks and get rewarded.</p>
      <a class="btn btn-primary auto" href="/signup.html">Get started</a>
    </div>
  </main>
</body>
</html>
